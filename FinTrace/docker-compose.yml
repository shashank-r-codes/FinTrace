services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrace_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fintrace_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fintrace_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrace} -d ${POSTGRES_DB:-fintrace_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fintrace-ml-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fintrace}:${POSTGRES_PASSWORD:-fintrace_dev_pass}@postgres:5432/${POSTGRES_DB:-fintrace_db}
      ML_ARTIFACTS_DIR: /app/artifacts
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - fintrace_ml_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrace-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fintrace}:${POSTGRES_PASSWORD:-fintrace_dev_pass}@postgres:5432/${POSTGRES_DB:-fintrace_db}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production_32chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrace-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
      VITE_SYNTHETIC_BANNER: ${VITE_SYNTHETIC_BANNER:-true}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  fintrace_pgdata:
  fintrace_ml_artifacts:
